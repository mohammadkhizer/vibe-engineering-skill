<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Engineering Skill - Agent Human-in-the-Loop Approval Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .terminal-window {
      width: 100%;
      max-width: 820px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.15);
      overflow: hidden;
    }
    .terminal-header {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }
    .title {
      margin-left: 16px;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
    .terminal-body {
      padding: 24px;
      min-height: 440px;
      font-size: 14px;
      line-height: 1.7;
    }
    .line {
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.3s ease;
    }
    .line.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .prompt-user {
      color: #38bdf8;
      font-weight: bold;
    }
    .agent-tag {
      color: #a855f7;
      font-weight: bold;
    }
    .text-dim { color: #64748b; }
    .text-green { color: #4ade80; }
    .text-yellow { color: #fbbf24; }
    .text-cyan { color: #22d3ee; }
    .approval-box {
      margin-top: 16px;
      background: rgba(245, 158, 11, 0.08);
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }
    .approval-title {
      color: #fbbf24;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .approval-msg {
      color: #f3f4f6;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
      animation: pulse 1.5s infinite;
    }
    .btn-secondary {
      background: #334155;
      color: #94a3b8;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #38bdf8;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>

  <div class="terminal-window">
    <div class="terminal-header">
      <div class="dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="title">vibe-engineering-skill — Human-in-the-Loop Gate (20s Demo)</div>
    </div>
    <div class="terminal-body" id="terminal">
      <!-- Dynamic lines inserted by script -->
    </div>
  </div>

  <script>
    const steps = [
      { delay: 400, html: `<span class="prompt-user">user@repo:~$</span> Add user bookmarking tab to MERN dashboard` },
      { delay: 1000, html: `<span class="agent-tag">[AGENTS.md]</span> Step 1: Loaded governance rules & active skills.` },
      { delay: 1600, html: `<span class="text-cyan">ℹ [research-before-design]</span> Inspecting Mongoose schema (models/User.js)...` },
      { delay: 2400, html: `<span class="text-cyan">ℹ [research-before-design]</span> Verifying existing endpoints in routes/bookmark.js...` },
      { delay: 3200, html: `<span class="text-yellow">⚡ [vibe-engineering-skill]</span> Drafting technical implementation plan...` },
      { delay: 4000, html: `<span class="text-green">✔ Created implementation plan:</span> <span class="text-dim">prompts/bookmark-tab.md</span>` },
      { delay: 4800, isApproval: true }
    ];

    const terminal = document.getElementById('terminal');

    function runAnimation() {
      terminal.innerHTML = '';
      let currentDelay = 0;

      steps.forEach((step) => {
        setTimeout(() => {
          if (step.isApproval) {
            const approvalDiv = document.createElement('div');
            approvalDiv.className = 'line visible approval-box';
            approvalDiv.innerHTML = `
              <div class="approval-title">⚠️ AGENT STOPPED MID-TASK (APPROVAL REQUIRED)</div>
              <div class="approval-msg">"I prepared the implementation prompt at <b>prompts/bookmark-tab.md</b>. Good to execute?"</div>
              <div class="btn-group">
                <button class="btn btn-primary">✓ Approve & Execute</button>
                <button class="btn btn-secondary">✕ Reject / Revise Plan</button>
              </div>
            `;
            terminal.appendChild(approvalDiv);
          } else {
            const line = document.createElement('div');
            line.className = 'line visible';
            line.innerHTML = step.html;
            terminal.appendChild(line);
          }
        }, step.delay);
      });
    }

    runAnimation();
    // Restart animation every 14 seconds for continuous preview
    setInterval(runAnimation, 14000);
  </script>
</body>
</html>
